<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>예니의 디지털 가든 (Digital Garden)</title>
  <meta name="theme-color" content="#588b67">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="예니 PDA">
  <link rel="manifest" href="manifest.json">
  <!-- External CSS / JS Libraries (D3.js, Google Fonts) -->
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      /* Obsidian Publish & Digital Garden Theme Palette */
      --bg-garden: #f9f8f3;
      --bg-panel: #ffffff;
      --bg-sidebar: #f2efe4;
      --text-main: #2c3531;
      --text-muted: #6e7a74;
      --primary: #588b67;
      --primary-hover: #3f684c;
      --primary-light: #e6eede;
      --border-color: #e0dbcd;
      --shadow: 0 4px 20px rgba(88, 139, 103, 0.06);
      --radius-lg: 16px;
      --radius-md: 10px;
      --danger: #c45c5c;
      --ai-purple: #7c3aed;

      /* Node & Tag Colors */
      --record: #7eb8d4;
      --person: #5daa68;
      --place: #f59e0b;
      --event: #a88fd4;

      /* Emotion Colors */
      --color-joy: #fcd34d;      /* 노랑 */
      --color-excited: #f472b6;  /* 핑크 */
      --color-calm: #34d399;     /* 초록 */
      --color-sad: #60a5fa;      /* 파랑 */
      --color-tense: #a78bfa;     /* 보라 */
      --color-angry: #f87171;    /* 빨강 */
      --color-miss: #fb923c;     /* 주황 (그리움) */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Outfit', 'Noto Sans KR', sans-serif;
      background-color: var(--bg-garden);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ── 애플리케이션 전체 레이아웃 ── */
    .garden-wrapper {
      display: flex;
      width: 100%;
      height: 100%;
    }

    /* 1. 좌측 탐색 사이드바 */
    .sidebar {
      width: 280px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sidebar-header {
      padding: 24px 20px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .profile-img-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px solid var(--primary);
      object-fit: cover;
    }
    
    .sidebar-brand h1 {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--primary-hover);
    }
    .sidebar-brand p {
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    /* 카테고리 트리 & 네비게이션 */
    .nav-tree {
      flex: 1;
      overflow-y: auto;
      padding: 16px 12px;
    }

    .tree-folder {
      margin-bottom: 12px;
    }

    .tree-folder-title {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      padding: 6px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .tree-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: var(--radius-md);
      font-size: 0.86rem;
      cursor: pointer;
      color: var(--text-main);
      transition: all 0.2s;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tree-item:hover {
      background-color: rgba(88, 139, 103, 0.08);
      color: var(--primary-hover);
    }
    .tree-item.active {
      background-color: var(--primary);
      color: white;
      font-weight: 500;
    }
    .tree-item .badge {
      margin-left: auto;
      font-size: 0.7rem;
      background: rgba(0,0,0,0.06);
      padding: 2px 6px;
      border-radius: 10px;
    }
    .tree-item.active .badge {
      background: rgba(255,255,255,0.25);
    }

    .sidebar-footer {
      padding: 16px;
      border-top: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* 2. 중앙 메인 작업/대시보드 영역 */
    .main-viewport {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-panel);
    }

    .garden-topbar {
      height: 64px;
      border-bottom: 1px solid var(--border-color);
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-panel);
    }

    .search-box {
      display: flex;
      align-items: center;
      background: var(--bg-garden);
      border-radius: 20px;
      padding: 6px 16px;
      width: 280px;
      border: 1px solid var(--border-color);
    }
    .search-box input {
      border: none;
      background: transparent;
      outline: none;
      margin-left: 8px;
      font-size: 0.85rem;
      width: 100%;
    }

    .toolbar-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    /* 메인 컨텐츠 영역 */
    .content-container {
      flex: 1;
      overflow-y: auto;
      padding: 32px 40px;
    }

    /* 3. 우측 지식 정원 정보 사이드바 */
    .info-sidebar {
      width: 380px;
      border-left: 1px solid var(--border-color);
      background-color: var(--bg-garden);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      height: 100%;
    }

    .info-panel-title {
      padding: 20px 20px 10px;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      border-bottom: 1px dotted var(--border-color);
    }

    .infographic-card {
      background: white;
      margin: 16px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-color);
      padding: 20px;
      box-shadow: var(--shadow);
      position: relative;
    }

    /* 감정 버블 차트 SVG */
    .emotion-bubble-svg {
      width: 100%;
      display: block;
      cursor: default;
    }
    .emotion-bubble-svg .bubble-circle {
      transition: opacity 0.15s, transform 0.15s;
      cursor: pointer;
      transform-origin: center;
    }
    .emotion-bubble-svg .bubble-circle:hover {
      opacity: 0.85;
      filter: brightness(1.08);
    }

    /* 감정 노트 팝업 오버레이 */
    .emotion-notes-popup {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255,255,255,0.97);
      border-radius: var(--radius-lg);
      z-index: 10;
      flex-direction: column;
      padding: 14px;
      overflow-y: auto;
    }
    .emotion-notes-popup.open { display: flex; }
    .popup-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      font-weight: 700;
      font-size: 0.92rem;
    }
    .popup-close {
      border: none;
      background: var(--bg-garden);
      border-radius: 50%;
      width: 26px;
      height: 26px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .popup-note-item {
      padding: 9px 12px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      margin-bottom: 7px;
      cursor: pointer;
      font-size: 0.84rem;
      transition: background 0.15s;
    }
    .popup-note-item:hover { background: var(--bg-garden); }

    /* 지식 그래프 영역 */
    .graph-container-card {
      flex: 1;
      background: white;
      margin: 0 16px 16px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    
    #garden-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* ── 양식 및 컴포넌트 ── */
    .btn {
      padding: 10px 18px;
      border-radius: var(--radius-md);
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: inherit;
    }
    .btn-brand {
      background-color: var(--primary);
      color: white;
    }
    .btn-brand:hover { background-color: var(--primary-hover); }

    .btn-ai {
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      color: white;
      box-shadow: 0 2px 10px rgba(124, 58, 237, 0.25);
    }
    .btn-ai:hover {
      background: linear-gradient(135deg, #6d28d9, #9333ea);
    }
    
    .btn-text {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border-color);
    }
    .btn-text:hover {
      background: var(--bg-garden);
      color: var(--text-main);
    }

    /* 메타 칩스 */
    .meta-chip-section {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 24px;
    }
    
    .meta-chip {
      font-size: 0.78rem;
      padding: 4px 10px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--bg-garden);
      border: 1px solid var(--border-color);
      color: var(--text-main);
    }
    .meta-chip.emotion-chip { font-weight: 600; }
    .meta-chip.emotion-chip.joy { background: #fef3c7; color: #92400e; border-color: #fcd34d; }
    .meta-chip.emotion-chip.excited { background: #fce7f3; color: #9d174d; border-color: #f472b6; }
    .meta-chip.emotion-chip.calm { background: #d1fae5; color: #065f46; border-color: #34d399; }
    .meta-chip.emotion-chip.sad { background: #dbeafe; color: #1e40af; border-color: #60a5fa; }
    .meta-chip.emotion-chip.tense { background: #ede9fe; color: #5b21b6; border-color: #a78bfa; }
    .meta-chip.emotion-chip.angry { background: #fee2e2; color: #991b1b; border-color: #f87171; }
    .meta-chip.emotion-chip.miss { background: #ffedd5; color: #9a3412; border-color: #fb923c; }

    /* 노트 본문 보기 테마 (Obsidian Style) */
    .note-viewer-header {
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 16px;
    }
    .note-viewer-title {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 8px;
    }
    .note-viewer-date {
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    
    .note-body-text {
      font-size: 1rem;
      line-height: 1.8;
      color: var(--text-main);
      white-space: pre-wrap;
    }

    .media-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
      margin-top: 24px;
    }
    .media-gallery img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
    }
    .media-gallery video {
      width: 100%;
      border-radius: var(--radius-md);
    }

    /* 입력 양식 (Obsidian Inline 스타일) */
    .editor-section {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .editor-field input[type="text"], .editor-field input[type="date"], .editor-field textarea {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      background-color: var(--bg-garden);
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--text-main);
      outline: none;
      transition: all 0.2s;
    }
    .editor-field input:focus, .editor-field textarea:focus {
      border-color: var(--primary);
      background-color: white;
      box-shadow: 0 0 0 3px rgba(88,139,103,0.12);
    }
    .editor-field textarea {
      min-height: 250px;
      resize: vertical;
    }

    /* 토스트 팝업 */
    .garden-toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--text-main);
      color: white;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 0.88rem;
      z-index: 500;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
    }
    .garden-toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* 백업 모달 */
    .garden-modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(44, 53, 49, 0.4);
      backdrop-filter: blur(4px);
      z-index: 400;
      align-items: center;
      justify-content: center;
    }
    .garden-modal-overlay.open { display: flex; }
    .garden-modal {
      background: white;
      border-radius: var(--radius-lg);
      max-width: 500px;
      width: 100%;
      padding: 24px;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }
    .garden-modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .garden-modal-close {
      border: none;
      background: transparent;
      font-size: 1.2rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="garden-wrapper">
  <!-- 1. 좌측 탐색 사이드바 -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <img id="garden-profile-img" class="profile-img-btn" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%23588b67'/><text x='50' y='60' font-size='35' text-anchor='middle' fill='white'>🌿</text></svg>" alt="프로필">
      <div class="sidebar-brand">
        <h1 id="garden-brand-title" onclick="window.changeGardenTitle()" style="cursor:pointer;" title="클릭하여 정원 이름 변경">예니의 지식 정원 <span style="font-size:0.85rem; color:var(--primary); font-weight:normal;">✏️</span></h1>
        <p style="cursor:pointer;" onclick="window.changeGardenTitle()">Obsidian Publish 스타일</p>
      </div>
    </div>
    
    <!-- 카테고리 / 노트 리스트 탐색기 -->
    <div class="nav-tree">
      <div class="tree-folder">
        <div class="tree-folder-title">📑 모든 노트 <span class="badge" id="badge-total-count">0</span></div>
        <div id="notes-list-container">
          <!-- 로딩 시 노트 리스트가 여기에 렌더링됨 -->
        </div>
      </div>
    </div>

    <div class="sidebar-footer">
      <button class="btn btn-brand" onclick="startNewNote()">✏️ 새 노트 작성</button>
      <button class="btn btn-text" onclick="openBackupModal()">💾 백업 및 복원</button>
    </div>
  </aside>

  <!-- 2. 중앙 메인 뷰포트 -->
  <main class="main-viewport">
    <div class="garden-topbar">
      <div class="search-box">
        🔍 <input type="text" id="garden-search-input" placeholder="키워드, 태그, 인물 검색...">
      </div>
      <div class="toolbar-actions">
        <span class="storage-badge" id="garden-storage-badge">저장소 연결 중...</span>
      </div>
    </div>

    <!-- 노트 상세 보기 및 편집 영역 -->
    <div class="content-container" id="content-container">
      <!-- 동적 노트 뷰어/편집기 로드 -->
    </div>
  </main>

  <!-- 3. 우측 지식 정원 정보 사이드바 -->
  <aside class="info-sidebar">
    <div class="info-panel-title">🔮 감정 단지</div>
    <div class="infographic-card" style="position:relative; padding: 14px;">
      <p style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 8px;">
        버블 크기 = 기록 수 &nbsp;·&nbsp; 클릭하면 해당 감정의 기록을 확인합니다.
      </p>
      <svg id="emotion-bubble-svg" class="emotion-bubble-svg" height="220"></svg>
      <!-- 감정별 노트 목록 팝업 -->
      <div class="emotion-notes-popup" id="emotion-notes-popup">
        <div class="popup-header">
          <span id="popup-emotion-label"></span>
          <button class="popup-close" onclick="closeEmotionPopup()">✕</button>
        </div>
        <div id="popup-notes-list"></div>
      </div>
    </div>

    <div class="info-panel-title">🕸️ 로컬 지식 네트워크</div>
    <div class="graph-container-card">
      <div id="graph-legend" class="graph-legend" style="padding: 10px 14px; border-bottom: 1px solid var(--border-color); font-size: 0.72rem;">
        <span class="legend-item"><span class="legend-dot" style="background:var(--record)"></span>노트</span>
        <span class="legend-item"><span class="legend-dot" style="background:var(--person)"></span>인물</span>
        <span class="legend-item"><span class="legend-dot" style="background:var(--place)"></span>장소</span>
        <span class="legend-item"><span class="legend-dot" style="background:var(--event)"></span>일정</span>
      </div>
      <div style="flex: 1; position: relative;">
        <svg id="garden-svg"></svg>
      </div>
    </div>
  </aside>
</div>

<!-- 백업 & 복원 모달 -->
<div class="garden-modal-overlay" id="garden-backup-modal">
  <div class="garden-modal">
    <div class="garden-modal-header">
      <h3 style="font-weight:700;">💾 데이터 백업 및 복원</h3>
      <button class="garden-modal-close" onclick="closeBackupModal()">✕</button>
    </div>
    <div style="font-size:0.85rem; line-height:1.6; color:var(--text-muted); margin-bottom:20px;">
      정원의 모든 지식 노트와 미디어, 감정 인포그래픽 데이터는 실시간으로 브라우저 영구 저장소에 자동 백업됩니다.<br>
      컴퓨터 변경이나 만약의 데이터 유실을 대비하여 아래 기능을 사용해 안전하게 내보내거나 합칠 수 있습니다.
    </div>
    <div style="display:flex; gap:12px; flex-direction:column;">
      <button class="btn btn-brand" style="justify-content:center; padding:12px;" onclick="exportGardenJSON()">📤 전체 데이터 JSON 백업 다운로드</button>
      
      <label class="btn btn-text" style="justify-content:center; padding:12px; cursor:pointer; text-align:center;">
        📥 백업 JSON 파일 선택하여 복원
        <input type="file" id="garden-import-input" accept=".json" style="display:none">
      </label>
    </div>
  </div>
</div>

<div class="garden-toast" id="garden-toast"></div>
<div class="saving-overlay" id="garden-saving-overlay" style="display:none;"></div>

<script>
const STORAGE_KEY = "my-local-app-data-v1";
const PROFILE_KEY = "my-local-app-profile-v1";

const EMOTIONS = [
  { id:"joy", emoji:"😊", label:"기쁨", orbClass:"orb-joy", color:"var(--color-joy)" },
  { id:"excited", emoji:"✨", label:"설렘", orbClass:"orb-excited", color:"var(--color-excited)" },
  { id:"calm", emoji:"😌", label:"평온", orbClass:"orb-calm", color:"var(--color-calm)" },
  { id:"sad", emoji:"😢", label:"슬픔", orbClass:"orb-sad", color:"var(--color-sad)" },
  { id:"tense", emoji:"😰", label:"긴장", orbClass:"orb-tense", color:"var(--color-tense)" },
  { id:"angry", emoji:"😤", label:"화남", orbClass:"orb-angry", color:"var(--color-angry)" },
  { id:"miss", emoji:"🧸", label:"그리움", orbClass:"orb-miss", color:"var(--color-miss)" },
];

const DB_NAME = "pda_archive_v2";
const DB_VERSION = 1;
const STORE = "entries";

let db = null;
let currentNotes = [];
let selectedNoteId = null;
let graphSimulation = null;

// 임시 미디어 보관소 (에디터용)

function esc(s) {
  return s ? String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;') : '';
}
function generateId() { return Date.now().toString(36) + Math.random().toString(36).substring(2, 6); }
function todayISO() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function formatDate(iso) { if(!iso) return ''; const [y,m,d] = iso.split('-'); return `${y}.${m}.${d}`; }
function getEmotion(id) { return EMOTIONS.find(e => e.id === id); }

function normalizeEntry(entry) {
  return {
    ...entry,
    people: Array.isArray(entry.people) ? entry.people : [],
    places: Array.isArray(entry.places) ? entry.places : [],
    events: Array.isArray(entry.events) ? entry.events : [],
    photos: Array.isArray(entry.photos) ? entry.photos : [],
    emotions: Array.isArray(entry.emotions) ? entry.emotions : (entry.emotion ? [entry.emotion] : []),
  };
}

function showToast(msg) {
  const t = document.getElementById('garden-toast');
  if(!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => t.classList.remove('show'), 2500);
}

// ── 자연어 메타데이터 자동 파싱 엔진 ──
function parseMetadataFromText(text) {
  if (!text || !text.trim()) return null;

  const result = {
    title: "",
    date: "",
    people: [],
    places: [],
    events: [],
    emotions: [],
  };

  const datePatterns = [
    /(\d{4})년\s*(\d{1,2})월\s*(\d{1,2})일/,
    /(\d{4})[-.](\d{1,2})[-.](\d{1,2})/,
  ];
  for (const pattern of datePatterns) {
    const match = text.match(pattern);
    if (match) {
      const y = match[1];
      const m = String(match[2]).padStart(2, '0');
      const d = String(match[3]).padStart(2, '0');
      result.date = `${y}-${m}-${d}`;
      break;
    }
  }

  const peopleRegex = /([가-힣]{2,4})(?:님|교수|부장|친구|선배|후배|과|와|이랑|하고)/g;
  let matchP;
  const excludePeople = ["오늘", "어제", "내일", "사람", "시간", "생각", "카페", "학교", "회사", "마음"];
  while ((matchP = peopleRegex.exec(text)) !== null) {
    const name = matchP[1];
    if (!excludePeople.includes(name) && !result.people.includes(name)) {
      result.people.push(name);
    }
  }

  const placeRegex = /([가-힣a-zA-Z0-9]+(?:역|카페|공원|사무실|학교|도서관|식당|병원|센터|관|지점|빌딩|룸|마을))/g;
  let matchPl;
  while ((matchPl = placeRegex.exec(text)) !== null) {
    const place = matchPl[1];
    if (!result.places.includes(place)) {
      result.places.push(place);
    }
  }

  const eventRegex = /([가-힣a-zA-Z0-9]+(?:회의|발표|미팅|생일|여행|파티|시험|학회|수업|축제|워크숍|프로젝트|면접))/g;
  let matchEv;
  while ((matchEv = eventRegex.exec(text)) !== null) {
    const ev = matchEv[1];
    if (!result.events.includes(ev)) {
      result.events.push(ev);
    }
  }

  const emotionKeywords = {
    joy: ["기쁘", "행복", "좋았", "즐겁", "최고", "성공", "만족", "웃음", "신나", "감사"],
    excited: ["설레", "기대", "두근", "설렘", "새로운", "시작", "원하던", "꿈꾸"],
    calm: ["평온", "조용", "편안", "휴식", "아늑", "여유", "힐링", "차분"],
    sad: ["슬프", "눈물", "우울", "아쉽", "서운", "울었", "상처", "속상"],
    tense: ["긴장", "불안", "걱정", "떨리", "부담", "초조", "스트레스"],
    angry: ["화나", "짜증", "분노", "답답", "열받", "황당", "억울"],
    miss: ["그립", "보고싶", "추억", "생각나", "오랜만", "그리움", "예전"]
  };

  Object.keys(emotionKeywords).forEach(emoId => {
    const keywords = emotionKeywords[emoId];
    if (keywords.some(kw => text.includes(kw))) {
      result.emotions.push(emoId);
    }
  });

  const firstLine = text.trim().split('\n')[0].replace(/[#*`]/g, '').trim();
  if (firstLine) {
    result.title = firstLine.length > 25 ? firstLine.slice(0, 25) + "…" : firstLine;
  }

  return result;
}

// ── 로컬 스토리지 읽기 / 저장 ──
function loadFromLocalStorage() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed)) return parsed.map(normalizeEntry);
    }
  } catch(e) {
    console.error("localStorage 로드 실패:", e);
  }
  return null;
}

function saveToLocalStorage(entries) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
  } catch(e) {
    console.error("localStorage 저장 실패:", e);
  }
}

// ── IndexedDB 열기 ──
function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const database = e.target.result;
      if (!database.objectStoreNames.contains(STORE)) {
        const store = database.createObjectStore(STORE, { keyPath:"id" });
        store.createIndex("date", "date", { unique:false });
        store.createIndex("createdAt", "createdAt", { unique:false });
      }
    };
    req.onsuccess = (e) => {
      db = e.target.result;
      resolve(db);
    };
    req.onerror = () => reject(req.error);
  });
}

// ── 데이터 연동 핵심 기능 ──
async function loadAllNotes() {
  const localData = loadFromLocalStorage();
  if (localData !== null) {
    currentNotes = localData.sort((a,b) => (b.date || '').localeCompare(a.date || '') || (b.createdAt || '').localeCompare(a.createdAt || ''));
    return currentNotes;
  }

  if (!db) return [];
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, "readonly");
    const req = tx.objectStore(STORE).getAll();
    req.onsuccess = () => {
      currentNotes = req.result.map(normalizeEntry).sort((a,b) => (b.date || '').localeCompare(a.date || '') || (b.createdAt || '').localeCompare(a.createdAt || ''));
      saveToLocalStorage(currentNotes);
      resolve(currentNotes);
    };
    req.onerror = () => reject(req.error);
  });
}

async function saveNote(note) {
  const entries = await loadAllNotes();
  const idx = entries.findIndex(e => e.id === note.id);
  if (idx !== -1) entries[idx] = note;
  else entries.unshift(note);

  saveToLocalStorage(entries);

  if (db) {
    try {
      const tx = db.transaction(STORE, "readwrite");
      tx.objectStore(STORE).put(note);
    } catch(e) { console.warn("IndexedDB 저장 실패 폴백 작동:", e); }
  }
  currentNotes = entries;
  return note;
}

async function deleteNote(id) {
  let entries = await loadAllNotes();
  entries = entries.filter(e => e.id !== id);
  saveToLocalStorage(entries);

  if (db) {
    try {
      const tx = db.transaction(STORE, "readwrite");
      tx.objectStore(STORE).delete(id);
    } catch(e) { console.warn("IndexedDB 삭제 실패 폴백 작동:", e); }
  }
  currentNotes = entries;
}

function renderSidebarList(notes) {

  const countBadge = document.getElementById("badge-total-count");
  if(!container) return;

  notes = notes || currentNotes;
  countBadge.textContent = notes.length;

    container.innerHTML = `<div style="padding: 20px 10px; text-align: center; color: var(--text-muted); font-size: 0.8rem;">작성된 노트가 없습니다.</div>`;
    return;
  }

  container.innerHTML = notes.map(note => {
    const activeClass = note.id === selectedNoteId ? 'active' : '';
    const emotionsStr = note.emotions.map(eid => {
      const emo = getEmotion(eid);
      return emo ? emo.emoji : "";

    return `
      <div class="tree-item ${activeClass}" onclick="selectNote('${note.id}')" title="${esc(note.title)}">

        <span style="font-size:0.75rem; margin-left:6px; opacity:0.85;">${emotionsStr}</span>

}

function autoParseEditorMetadataGarden() {
  const text = document.getElementById("editor-text").value;
  if (!text || !text.trim()) {
    showToast("⚠️ 파싱할 본문 내용을 먼저 입력해 주세요.");
    return;
  }

  const parsed = parseMetadataFromText(text);
  if (!parsed) return;

  let addedCount = 0;
  const titleInput = document.getElementById("editor-title");
  if (!titleInput.value.trim() && parsed.title) {
    titleInput.value = parsed.title;
    addedCount++;
  }

  if (parsed.date) {
    document.getElementById("editor-date").value = parsed.date;
    addedCount++;
  }

  parsed.people.forEach(p => {
    if (!editorTagStores.people.includes(p)) {
      editorTagStores.people.push(p);
      addedCount++;
    }
  });
  document.getElementById("editor-people-wrap").draw();

  parsed.places.forEach(pl => {
    if (!editorTagStores.places.includes(pl)) {
      editorTagStores.places.push(pl);
      addedCount++;
    }
  });
  document.getElementById("editor-places-wrap").draw();

  parsed.events.forEach(ev => {
    if (!editorTagStores.events.includes(ev)) {
      editorTagStores.events.push(ev);
      addedCount++;
    }
  });
  document.getElementById("editor-events-wrap").draw();

  parsed.emotions.forEach(emoId => {
    if (!editorSelectedEmotions.has(emoId)) {
      editorSelectedEmotions.add(emoId);
      const btn = document.querySelector(`.emotion-btn[data-id="${emoId}"]`);
      if (btn) btn.classList.add("selected");
      addedCount++;
    }
  });

  if (addedCount > 0) {
    showToast(`✨ 자연어 파싱 완료! 메타데이터 및 태그가 자동 추출되었습니다.`);
  } else {
    showToast(`✨ 이미 메타데이터가 파싱되어 있습니다.`);
  }
}

const editorTagStores = { people:[], places:[], events:[] };
function initEditorTagInputs(peo, pla, eve) {
  editorTagStores.people = [...peo];
  editorTagStores.places = [...pla];
  editorTagStores.events = [...eve];

  setupTagField('people', 'editor-people-wrap', 'person');
  setupTagField('places', 'editor-places-wrap', 'place');
  setupTagField('events', 'editor-events-wrap', 'event');
}

function setupTagField(key, wrapId, cls) {
  const wrap = document.getElementById(wrapId);
  if(!wrap) return;
  const input = wrap.querySelector("input");
  
  function draw() {
    wrap.querySelectorAll(".tag-chip").forEach(c => c.remove());
    editorTagStores[key].forEach((tag, i) => {
      const chip = document.createElement("span");
      chip.className = `tag-chip ${cls}`;
      chip.innerHTML = `${esc(tag)}<button type="button" onclick="removeEditorTag('${key}', ${i})">×</button>`;
      wrap.insertBefore(chip, input);
    });
  }

  input.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === ",") {
      e.preventDefault();
      const val = input.value.trim().replace(/,$/, "");
      if (val && !editorTagStores[key].includes(val)) {
        editorTagStores[key].push(val);
        input.value = "";
        draw();
      }
    } else if (e.key === "Backspace" && !input.value && editorTagStores[key].length) {
      editorTagStores[key].pop();
      draw();
    }
  });

  draw();
  wrap.draw = draw;
}

function removeEditorTag(key, idx) {
  editorTagStores[key].splice(idx, 1);
  const wrapMap = { people:'editor-people-wrap', places:'editor-places-wrap', events:'editor-events-wrap' };
  document.getElementById(wrapMap[key]).draw();
}

function toggleEditorEmotion(btn, id) {
  if (editorSelectedEmotions.has(id)) {
    editorSelectedEmotions.delete(id);
    btn.classList.remove('selected');
  } else {
    editorSelectedEmotions.add(id);
    btn.classList.add('selected');
  }
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function handleEditorPhotos(input) {
  for (const file of input.files) {
    const data = await fileToBase64(file);
    editorPhotos.push({ data, name:file.name, type:file.type });
  }
  drawEditorPhotoPreview();
  input.value = "";
}

function drawEditorPhotoPreview() {
  const container = document.getElementById("editor-photo-preview");
  if(!container) return;
  container.innerHTML = editorPhotos.map((p, i) =>
    `<div class="preview-item"><img src="${p.data}"><button class="remove" onclick="removeEditorPhoto(${i})">✕</button></div>`
  ).join("");
}

function removeEditorPhoto(idx) {
  editorPhotos.splice(idx, 1);
  drawEditorPhotoPreview();
}

async function handleEditorVideo(input) {
  const file = input.files[0];
  if(!file) return;
  const data = await fileToBase64(file);
  editorVideo = { data, name:file.name, type:file.type };
  drawEditorVideoPreview();
  input.value = "";
}

function drawEditorVideoPreview() {
  const container = document.getElementById("editor-video-preview");
  if(!container) return;
  if(editorVideo) {
    container.innerHTML = `<div class="preview-item" style="width:120px;height:80px"><video src="${editorVideo.data}"></video><button class="remove" onclick="removeEditorVideo()">✕</button></div>`;
  } else {
    container.innerHTML = "";
  }
}

function removeEditorVideo() {
  editorVideo = null;
  drawEditorVideoPreview();
}

async function saveEditorData() {
  const titleVal = document.getElementById("editor-title").value.trim();
  const textVal = document.getElementById("editor-text").value.trim();
  if(!titleVal && !textVal) {
    showToast("제목이나 내용을 입력해 주세요.");
    return;
  }

  const isEdit = !!selectedNoteId;
  const oldNote = isEdit ? currentNotes.find(x => x.id === selectedNoteId) : null;

  const note = {
    id: isEdit ? selectedNoteId : generateId(),
    title: titleVal || "(제목 없음)",
    date: document.getElementById("editor-date").value || todayISO(),
    text: textVal,
    photos: [...editorPhotos],
    video: editorVideo ? { ...editorVideo } : null,
    people: [...editorTagStores.people],
    places: [...editorTagStores.places],
    events: [...editorTagStores.events],
    emotions: [...editorSelectedEmotions],
    createdAt: isEdit ? (oldNote.createdAt || new Date().toISOString()) : new Date().toISOString(),
    updatedAt: new Date().toISOString()
  };

  await saveNote(note);
  showToast(isEdit ? "노트가 수정되었습니다 ✓" : "새 노트가 추가되었습니다 ✓");
  
  await refreshAll();
  selectNote(note.id);
}

function cancelEditor() {
  if (selectedNoteId) {
    selectNote(selectedNoteId);
  } else {
    if(currentNotes.length > 0) {
      selectNote(currentNotes[0].id);
    } else {
      document.getElementById("content-container").innerHTML = `
        <div class="empty-state">
          <div class="icon">🌿</div>
          <h2>예니의 디지털 가든에 오신 것을 환영합니다</h2>
          <p style="margin-top: 10px;">왼쪽 하단의 [새 노트 작성] 버튼을 클릭해 첫 지식 노트를 추가해보세요.</p>
        </div>
      `;
    }
  }
}

async function handleDeleteNote(id) {
  if(!confirm("이 노트를 영구적으로 삭제할까요?")) return;
  await deleteNote(id);
  showToast("노트가 삭제되었습니다.");
  await refreshAll();
  if(currentNotes.length > 0) {
    selectNote(currentNotes[0].id);
  } else {
    cancelEditor();
  }
}

// ── D3 감정 단지 버블 차트 렌더링 ──
function renderJarInfographic(notes) {
  const svgEl = document.getElementById("emotion-bubble-svg");
  if (!svgEl) return;

  const emotionMap = new Map();
  EMOTIONS.forEach(e => emotionMap.set(e.id, []));

  notes.forEach(note => {
    note.emotions.forEach(eid => {
      if (emotionMap.has(eid)) emotionMap.get(eid).push(note);
    });
  });

  const emotionNodes = EMOTIONS
    .map(e => ({ ...e, noteList: emotionMap.get(e.id) || [], count: (emotionMap.get(e.id) || []).length }))
    .filter(e => e.count > 0);

  const svg = d3.select(svgEl);
  svg.selectAll("*").remove();

  const W = svgEl.clientWidth || 348;
  const H = 220;
  svg.attr("viewBox", `0 0 ${W} ${H}`);

  if (emotionNodes.length === 0) {
    svg.append("text")
      .attr("x", W / 2).attr("y", H / 2)
      .attr("text-anchor", "middle")
      .attr("font-size", "13px")
      .attr("fill", "#b0a89a")
      .text("감정이 기록된 노트가 없습니다");
    return;
  }

  const maxCount = Math.max(...emotionNodes.map(e => e.count));
  const numEmotions = emotionNodes.length;
  const maxR = Math.min(40, Math.floor(W / (numEmotions * 1.8)));
  const minR = 14;
  const rScale = d3.scaleSqrt().domain([0, maxCount]).range([0, maxR]);
  emotionNodes.forEach(e => { e.r = Math.max(minR, rScale(e.count)); });

  const simulation = d3.forceSimulation(emotionNodes)
    .force("center", d3.forceCenter(W / 2, H / 2))
    .force("charge", d3.forceManyBody().strength(3))
    .force("collision", d3.forceCollide().radius(d => d.r + 5).strength(1.0))
    .force("x", d3.forceX(W / 2).strength(0.07))
    .force("y", d3.forceY(H / 2).strength(0.07))
    .stop();

  for (let i = 0; i < 300; i++) simulation.tick();

  emotionNodes.forEach(e => {
    e.x = Math.max(e.r + 4, Math.min(W - e.r - 4, e.x));
    e.y = Math.max(e.r + 4, Math.min(H - e.r - 4, e.y));
  });

  const colorMap = {
    joy: "#fbbf24", excited: "#f472b6", calm: "#34d399",
    sad: "#60a5fa", tense: "#a78bfa", angry: "#f87171", miss: "#fb923c"
  };

  const g = svg.append("g");

  const node = g.selectAll(".emotion-node")
    .data(emotionNodes)
    .join("g")
    .attr("class", "emotion-node")
    .attr("transform", d => `translate(${d.x},${d.y})`)
    .attr("cursor", "pointer")
    .on("click", (_, d) => openEmotionPopup(d));

  node.append("circle")
    .attr("class", "bubble-circle")
    .attr("r", d => d.r)
    .attr("fill", d => colorMap[d.id] || "#ccc")
    .attr("fill-opacity", 0.82)
    .attr("stroke", d => colorMap[d.id] || "#ccc")
    .attr("stroke-width", 2)
    .attr("stroke-opacity", 0.5);

  node.append("text")
    .attr("text-anchor", "middle")
    .attr("dy", d => d.r >= 24 ? "-8px" : "-2px")
    .attr("font-size", d => d.r >= 24 ? "14px" : "10px")
    .attr("pointer-events", "none")
    .text(d => d.emoji);

  node.filter(d => d.r >= 16)
    .append("text")
    .attr("text-anchor", "middle")
    .attr("dy", d => d.r >= 24 ? "7px" : "5px")
    .attr("font-size", d => d.r >= 24 ? "8.5px" : "7px")
    .attr("font-weight", "700")
    .attr("fill", "white")
    .attr("pointer-events", "none")
    .text(d => d.label);

  node.filter(d => d.r >= 22)
    .append("text")
    .attr("text-anchor", "middle")
    .attr("dy", d => d.r >= 24 ? "18px" : "14px")
    .attr("font-size", "8px")
    .attr("font-weight", "600")
    .attr("fill", "rgba(255,255,255,0.85)")
    .attr("pointer-events", "none")
    .text(d => `${d.count}개`);
}

function openEmotionPopup(emotionNode) {
  const popup = document.getElementById("emotion-notes-popup");
  const label = document.getElementById("popup-emotion-label");
  const list = document.getElementById("popup-notes-list");
  if (!popup || !label || !list) return;

  label.innerHTML = `${emotionNode.emoji} ${emotionNode.label} · ${emotionNode.count}개의 기록`;

  list.innerHTML = emotionNode.noteList.map(note => `
    <div class="popup-note-item" data-id="${note.id}">
      <strong>${esc(note.title)}</strong>
      <div style="font-size:0.76rem; color:var(--text-muted); margin-top:2px;">${formatDate(note.date)}</div>
    </div>
  `).join("");

  list.querySelectorAll(".popup-note-item").forEach(el => {
    el.addEventListener("click", () => {
      closeEmotionPopup();
      selectNote(el.dataset.id);
      showToast(`📖 '${el.querySelector("strong").textContent}' 노트로 이동합니다.`);
    });
  });

  popup.classList.add("open");
}

function closeEmotionPopup() {
  const popup = document.getElementById("emotion-notes-popup");
  if (popup) popup.classList.remove("open");
}

// ── D3 지식 그래프 ──
function renderGraph(entries) {
  const svg = d3.select("#garden-svg");
  svg.selectAll("*").remove();

  if(!entries.length) return;

  const container = document.getElementById("graph-legend").nextElementSibling;
  const width = container.clientWidth || 340;
  const height = container.clientHeight || 300;
  svg.attr("viewBox", `0 0 ${width} ${height}`);

  const nodes = [], linkKeys = new Set(), links = [], nodeMap = new Map();
  const nodeRadius = { record:12, person:8, place:9, event:8 };

  function addNode(id, label, type, entryId) {
    if (!nodeMap.has(id)) {
      const node = { id, label, type, entryId: entryId||null, r: nodeRadius[type]||8 };
      nodeMap.set(id, node);
      nodes.push(node);
    }
    return nodeMap.get(id);
  }

  function addLink(sourceId, targetId, kind) {
    const key = [sourceId, targetId].sort().join("|")+":"+kind;
    if (linkKeys.has(key)) return;
    linkKeys.add(key);
    links.push({ source:sourceId, target:targetId, kind });
  }

  entries.forEach(entry => {
    const recId = "rec:"+entry.id;
    const title = entry.title.length > 8 ? entry.title.slice(0,8)+"…" : entry.title;
    addNode(recId, title, "record", entry.id);
    entry.people.forEach(p => { addNode("person:"+p, p, "person"); addLink(recId, "person:"+p, "tag"); });
    entry.places.forEach(p => { addNode("place:"+p, p, "place"); addLink(recId, "place:"+p, "tag"); });
    entry.events.forEach(p => { addNode("event:"+p, p, "event"); addLink(recId, "event:"+p, "tag"); });
  });

  function connectRecords(tagKey) {
    const groups = new Map();
    entries.forEach(entry => {
      entry[tagKey].forEach(tag => {
        if (!groups.has(tag)) groups.set(tag, []);
        groups.get(tag).push(entry.id);
      });
    });
    groups.forEach(ids => {
      for (let i = 0; i < ids.length; i++) {
        for (let j = i+1; j < ids.length; j++) {
          addLink("rec:"+ids[i], "rec:"+ids[j], "shared");
        }
      }
    });
  }
  connectRecords("people");
  connectRecords("places");
  connectRecords("events");

  const colorMap = { record:"#7eb8d4", person:"#5daa68", place:"#f59e0b", event:"#a88fd4" };
  const strokeMap = { record:"#5a9ab8", person:"#3d8a50", place:"#d97706", event:"#7a65b0" };

  const g = svg.append("g");
  const zoom = d3.zoom().scaleExtent([0.4, 2.5]).on("zoom", event => g.attr("transform", event.transform));
  svg.call(zoom);

  graphSimulation = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(links).id(d => d.id).distance(50))
    .force("charge", d3.forceManyBody().strength(-100))
    .force("center", d3.forceCenter(width/2, height/2))
    .force("collision", d3.forceCollide().radius(d => d.r + 6));

  const link = g.append("g").selectAll("line").data(links).join("line")
    .attr("stroke", "#cfcab8")
    .attr("stroke-width", 1.2)
    .attr("stroke-opacity", 0.7);

  const node = g.append("g").selectAll("g").data(nodes).join("g")
    .attr("cursor", "pointer")
    .call(d3.drag()
      .on("start", (event, d) => { if (!event.active) graphSimulation.alphaTarget(0.2).restart(); d.fx=d.x; d.fy=d.y; })
      .on("drag", (event, d) => { d.fx=event.x; d.fy=event.y; })
      .on("end", (event, d) => { if (!event.active) graphSimulation.alphaTarget(0); d.fx=null; d.fy=null; }));

  node.append("circle")
    .attr("r", d => d.r)
    .attr("fill", d => colorMap[d.type])
    .attr("stroke", d => strokeMap[d.type])
    .attr("stroke-width", 1.5);

  node.append("text")
    .text(d => d.label)
    .attr("text-anchor", "middle")
    .attr("dy", d => d.r + 10)
    .attr("font-size", "8px")
    .attr("fill", "#4e493c")
    .attr("pointer-events", "none");

  node.on("click", (_, d) => {
    if (d.type === "record") {
      selectNote(d.entryId);
    } else {
      document.getElementById("garden-search-input").value = d.label;
      handleSearch(d.label);
      showToast(`🔍 '${d.label}' 태그를 검색합니다.`);
    }
  });

  graphSimulation.on("tick", () => {
    link.attr("x1", d => d.source.x).attr("y1", d => d.source.y)
        .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
    node.attr("transform", d => `translate(${d.x},${d.y})`);
  });
}

function handleSearch(query) {
  const q = query.trim().toLowerCase();
  if(!q) {
    renderSidebarList(currentNotes);
    return;
  }

  const filtered = currentNotes.filter(n => {
    const hay = [
      n.title,
      n.text,
      ...n.people,
      ...n.places,
      ...n.events,
      ...n.emotions.map(eid => getEmotion(eid)?.label || "")
    ].join(" ").toLowerCase();
    return hay.includes(q);
  });

  renderSidebarList(filtered);
}

function openBackupModal() { document.getElementById("garden-backup-modal").classList.add("open"); }
function closeBackupModal() { document.getElementById("garden-backup-modal").classList.remove("open"); }

async function exportGardenJSON() {
  if (!currentNotes.length) { showToast("내보낼 노트가 없습니다."); return; }
  const fileName = `backup-${todayISO()}.json`;
  const blob = new Blob([JSON.stringify({ version:1, exportedAt: new Date().toISOString(), entries: currentNotes }, null, 2)], { type:"application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = fileName;
  a.click(); URL.revokeObjectURL(url);
  showToast(`📤 백업 완료! (${fileName})`);
}

function initImportAction() {
  const input = document.getElementById("garden-import-input");
  if(!input) return;
  input.addEventListener("change", async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        const importedEntries = Array.isArray(data) ? data : (data.entries || []);
        if (!Array.isArray(importedEntries)) throw new Error("백업 데이터 파일 형식이 올바르지 않습니다.");

        const existing = await loadAllNotes();
        const map = new Map(existing.map(x => [x.id, x]));
        let added = 0;

        importedEntries.forEach(item => {
          const norm = normalizeEntry(item);
          if (!map.has(norm.id)) {
            map.set(norm.id, norm);
            added++;
          }
        });

        const merged = [...map.values()];
        saveToLocalStorage(merged);
        if (db) {
          const tx = db.transaction(STORE, "readwrite");
          merged.forEach(item => tx.objectStore(STORE).put(item));
        }

        showToast(`📥 복원 완료! ${added}개 노트 추가 (총 ${merged.length}개)`);
        closeBackupModal();
        await refreshAll();
        if(currentNotes.length > 0) selectNote(currentNotes[0].id);
      } catch (err) {
        showToast("❌ 복원 실패: " + err.message);
      } finally {
        input.value = "";
      }
    };
    reader.readAsText(file);
  });
}

const TITLE_KEY = "my-local-app-title-v1";

function initGardenTitle() {
  const savedTitle = localStorage.getItem(TITLE_KEY);
  const titleEl = document.getElementById("garden-brand-title");
  if (savedTitle && titleEl) {
    titleEl.innerHTML = esc(savedTitle) + ' <span style="font-size:0.85rem; color:var(--primary); font-weight:normal;">✏️</span>';
  }
}

window.changeGardenTitle = function() {
  const savedTitle = localStorage.getItem(TITLE_KEY);
  const current = savedTitle || "예니의 지식 정원";
  const newTitle = prompt("나만의 디지털 정원 이름을 입력하세요:", current);
  if (newTitle && newTitle.trim()) {
    const cleanTitle = newTitle.trim();
    localStorage.setItem(TITLE_KEY, cleanTitle);
    const titleEl = document.getElementById("garden-brand-title");
    if (titleEl) {
      titleEl.innerHTML = esc(cleanTitle) + ' <span style="font-size:0.85rem; color:var(--primary); font-weight:normal;">✏️</span>';
    }
    showToast(`🌿 정원 이름이 '${cleanTitle}'(으)로 변경되었습니다!`);
  }
};

function initProfileImage() {
  const imgEl = document.getElementById("garden-profile-img");
  const saved = localStorage.getItem(PROFILE_KEY);
  if(saved && imgEl) {
    imgEl.src = saved;
  }
}

async function refreshAll() {
  await loadAllNotes();
  renderSidebarList(currentNotes);
  renderJarInfographic(currentNotes);
  renderGraph(currentNotes);
}

document.addEventListener("DOMContentLoaded", async () => {
  initProfileImage();
  initGardenTitle();
  initImportAction();

  try {
    await openDB();
  } catch(e) {
    console.warn("IndexedDB 연결 실패, localStorage로 동작합니다:", e);
  }

  await refreshAll();

  if(currentNotes.length > 0) {
    selectNote(currentNotes[0].id);
  } else {
    startNewNote();
  }

  const searchInput = document.getElementById("garden-search-input");
  if(searchInput) {
    searchInput.addEventListener("input", (e) => {
      handleSearch(e.target.value);
    });
  }

  // PWA Service Worker 및 설치 프롬프트
  initPWAServiceWorker();
});

let deferredPrompt = null;
function initPWAServiceWorker() {
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').then((reg) => {
        console.log('[PWA] ServiceWorker registered with scope:', reg.scope);
      }).catch((err) => {
        console.warn('[PWA] ServiceWorker registration failed:', err);
      });
    });
  }

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    const installBtn = document.getElementById('pwa-install-btn');
    if (installBtn) installBtn.style.display = 'inline-flex';
    showToast("📱 '예니 PDA'를 스마트폰/PC 전용 앱으로 설치할 수 있습니다!");
  });
}

function installPWAApp() {
  if (!deferredPrompt) {
    showToast("이미 설치되어 있거나 브라우저에서 PWA 설치를 지원하지 않는 환경입니다.");
    return;
  }
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then((choiceResult) => {
    if (choiceResult.outcome === 'accepted') {
      showToast("🎉 앱 설치가 완료되었습니다!");
      const installBtn = document.getElementById('pwa-install-btn');
      if (installBtn) installBtn.style.display = 'none';
    }
    deferredPrompt = null;
  });
}
